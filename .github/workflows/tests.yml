# ================================================================
# OHS WEBSITE TESTS — runs on every pull request (and on demand)
# ================================================================
# Serves the site from the repo and runs the browser test suite in
# tests/ (see tests/README.md). A failing test marks the PR red.
# Deploys are unaffected: deploy.yml does not run or ship tests/.
# ================================================================

name: Website tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install test tools (exact versions from tests/package-lock.json)
      working-directory: tests
      run: |
        npm ci --no-fund
        npx playwright install --with-deps chromium

    - name: Check test tools for known vulnerabilities
      working-directory: tests
      run: npm audit --audit-level=high

    - name: Run tests
      run: node tests/run-all.js

  # Same browser suites on Firefox and WebKit (Safari's engine). Gating, like the
  # Chromium job: a failure marks the PR red. Chromium-only suites are left out:
  # a11y (axe results are engine-independent), prerender (uses Chrome's
  # layout-shift API), and the plain-Node suites.
  cross-browser:
    name: Cross-browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [ firefox, webkit ]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install test tools (exact versions from tests/package-lock.json)
      working-directory: tests
      run: |
        npm ci --no-fund
        npx playwright install --with-deps ${{ matrix.browser }}

    - name: Run browser suites on ${{ matrix.browser }}
      env:
        OHS_BROWSER: ${{ matrix.browser }}
      run: node tests/run-all.js smoke checkout cartlines qa handoff bookform mcart consent state modal inventory mobilenav catalog filters calccards
