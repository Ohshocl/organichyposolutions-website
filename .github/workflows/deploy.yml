# ================================================================
# ORGANIC HYPOSOLUTIONS - DEPLOYMENT WORKFLOW
# ================================================================
# Deploys static site to GitHub Pages on push to main.
#
# Critical files that MUST be in _site/:
#   - index.html
#   - shop/js/product-catalog.js  (single source of truth for products)
#   - templates/standard-nav.html (loaded dynamically by JS at runtime)
#   - templates/standard-footer.html
#
# Files EXCLUDED from _site/ (dev-only):
#   - .env.example, README.md, package.json, package-lock.json
#   - CLAUDE.md, docs/ (update rules and playbook, internal only)
#   - node_modules, .git, .github
#   - api/ (Vercel serverless functions — deployed separately)
#
# Last Updated: 2026-11-24 (real sitemap dates, loud copy errors,
#   JS/sitemap checks, one automatic retry of the Pages deploy)
# ================================================================

name: Deploy OHS Website

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
    # ----------------------------------------
    # Checkout
    # ----------------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history, so sitemap dates can come from each page's last commit

    # ----------------------------------------
    # Node.js 20 (only needed if package.json exists)
    # ----------------------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        if [ -f package.json ]; then
          echo "Installing dependencies..."
          npm install
        else
          echo "No package.json — skipping"
        fi

    # ----------------------------------------
    # Sitemap lastmod = date each page last changed (from git)
    # (Before: every date was reset to the deploy day, which tells search
    #  engines every page changed on every deploy.)
    # ----------------------------------------
    - name: Update Sitemap Dates
      run: |
        if [ ! -f "sitemap.xml" ]; then echo "No sitemap.xml found — skipping"; exit 0; fi
        python3 - <<'PY'
        import re, subprocess
        s = open('sitemap.xml', encoding='utf-8').read()
        def last_changed(path):
            r = subprocess.run(['git', 'log', '-1', '--format=%cs', '--', path],
                               capture_output=True, text=True)
            return r.stdout.strip()
        def fix(m):
            block = m.group(0)
            loc = re.search(r'<loc>https?://[^/]+/([^<]*)</loc>', block)
            if not loc:
                return block
            path = loc.group(1) or 'index.html'
            d = last_changed(path)
            if not d:
                return block
            return re.sub(r'<lastmod>[^<]*</lastmod>', '<lastmod>' + d + '</lastmod>', block)
        out = re.sub(r'<url>.*?</url>', fix, s, flags=re.S)
        open('sitemap.xml', 'w', encoding='utf-8').write(out)
        print('Sitemap lastmod dates set from git history')
        PY

    # ----------------------------------------
    # Prepare static site
    # ----------------------------------------
    - name: Prepare Static Site
      run: |
        set -euo pipefail
        mkdir -p _site

        # Copy everything except _site itself and dev-only files. Dotfiles
        # (.git, .github, .env.example, .gitignore) are skipped, same as before.
        # A real copy error now fails the deploy instead of being hidden by
        # "2>/dev/null || true". api/ is the Vercel serverless functions
        # directory (deployed separately).
        find . -mindepth 1 -maxdepth 1 ! -name '.*' \
          ! -name _site ! -name node_modules ! -name docs ! -name api ! -name tests \
          ! -name README.md ! -name CLAUDE.md ! -name package.json ! -name package-lock.json \
          -exec cp -r -t _site/ {} +

        # ---- DO NOT remove _site/templates/ ----
        # Nav and footer are fetched at runtime by global-scripts.js.
        # Removing templates/ would break the entire site navigation.

        echo "Static site prepared"

    # ----------------------------------------
    # Validate critical files exist
    # ----------------------------------------
    - name: Validate Build
      run: |
        PASS=true

        # index.html — homepage
        if [ ! -f "_site/index.html" ]; then
          echo "FAIL: index.html missing from build"
          PASS=false
        fi

        # product-catalog.js — single source of truth for all product data
        if [ ! -f "_site/shop/js/product-catalog.js" ]; then
          echo "FAIL: shop/js/product-catalog.js missing from build"
          PASS=false
        fi

        # standard-nav.html — loaded dynamically, site breaks without it
        if [ ! -f "_site/templates/standard-nav.html" ]; then
          echo "FAIL: templates/standard-nav.html missing from build"
          PASS=false
        fi

        # standard-footer.html
        if [ ! -f "_site/templates/standard-footer.html" ]; then
          echo "WARN: templates/standard-footer.html missing (footer won't load)"
        fi

        # JavaScript files must parse
        for f in $(find _site/assets/js _site/shop/js -name '*.js' 2>/dev/null); do
          if ! node --check "$f"; then
            echo "FAIL: JavaScript syntax error in ${f#_site/}"
            PASS=false
          fi
        done

        # sitemap.xml must be valid XML and every URL must be a real page
        if [ -f "_site/sitemap.xml" ]; then
          if ! python3 - <<'PY'
        import sys, os, xml.dom.minidom
        doc = xml.dom.minidom.parse('_site/sitemap.xml')
        bad = []
        for loc in doc.getElementsByTagName('loc'):
            path = loc.firstChild.data.split('://', 1)[-1].split('/', 1)[-1] or 'index.html'
            if not os.path.isfile(os.path.join('_site', path)):
                bad.append(path)
        if bad:
            print('FAIL: sitemap lists pages that do not exist: ' + ', '.join(bad))
            sys.exit(1)
        PY
          then PASS=false; fi
        fi

        # The test suite (tests/) must never be published
        if [ -e "_site/tests" ]; then
          echo "FAIL: tests/ folder is in the build"
          PASS=false
        fi

        # Internal pages removed in Change Request R1-R6 must not come back
        for f in moldplan.html salesguide.html pamphlets.html math1010sg.html d470.html studyguide.html; do
          if [ -f "_site/$f" ]; then
            echo "FAIL: internal page $f is in the build"
            PASS=false
          fi
        done

        if [ "$PASS" = false ]; then
          echo ""
          echo "Build validation FAILED — aborting deploy"
          exit 1
        fi

        echo "Build validation passed"

    # ----------------------------------------
    # Deploy to GitHub Pages
    # ----------------------------------------
    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload to Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    # GitHub sometimes fails this step with "Fetching artifact metadata
    # failed ... re-run later" right after the upload. Retry once on its own.
    - name: Deploy to GitHub Pages
      id: deployment
      continue-on-error: true
      uses: actions/deploy-pages@v4

    - name: Wait before retrying deploy
      if: steps.deployment.outcome == 'failure'
      run: sleep 45

    - name: Deploy to GitHub Pages (retry)
      id: deployment_retry
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v4

    - name: Deployment Summary
      run: |
        echo "Deployment complete: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
