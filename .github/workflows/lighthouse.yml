# ================================================================
# OHS PERFORMANCE CHECK — Lighthouse on the LIVE site
# ================================================================
# Measures key pages (mobile, median of 3 runs) and compares them to
# tests/perf-baseline.json. Runs weekly, on demand, and on pull
# requests that change this check. Results are in the job summary.
# Does not deploy or change anything.
# ================================================================

name: Performance (Lighthouse)

on:
  schedule:
    - cron: '17 9 * * 1'      # Mondays 09:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/lighthouse.yml'
      - 'tests/lighthouse.js'
      - 'tests/perf-baseline.json'

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGHTHOUSE_VERSION: '12.2.1'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Lighthouse (pinned)
      run: npm install --global --no-fund --no-audit lighthouse@${LIGHTHOUSE_VERSION}

    - name: Measure the live site
      run: node tests/lighthouse.js
